spring.application.name=wallet
application.globalRoundingMode=HALF_EVEN
application.globalNumberScale=2
cnb.api.url=https://api.cnb.cz
cnb.api.timeoutInSeconds=10

# In-memory H2 in PostgreSQL compatibility mode; data is lost on restart (by design, see README).
spring.datasource.url=jdbc:h2:mem:wallet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
