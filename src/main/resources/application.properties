spring.application.name=wallet
application.globalRoundingMode=HALF_EVEN
application.globalNumberScale=2
# Whole application runs in this time zone
application.timezone=Europe/Prague
cnb.api.url=https://api.cnb.cz
cnb.api.timeoutInSeconds=10
# Run only around time when it will get refreshed
cnb.rates.cacheEvictCronFrom1430=0 30-59/3 14 * * MON-FRI

# In-memory H2 in PostgreSQL compatibility mode; data is lost on restart (by design, see README).
spring.datasource.url=jdbc:h2:mem:wallet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=embedded
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
